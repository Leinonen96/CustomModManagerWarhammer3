[package]
name = "wh3-mod-manager"
version = "2.0.0"
description = "Total War: WARHAMMER III Native Mod Manager"
authors = ["Tuomas Leinonen"]
edition = "2021"

[lib]
name = "wh3_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
dirs = "6"
base64 = "0.22"
