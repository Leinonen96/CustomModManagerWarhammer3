<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background gradient matching your UI panels -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202024" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>
    
    <!-- Subtle glow effect for the hammer's green accent -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Icon Shape (Squircle) -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" stroke="#323238" stroke-width="4"/>

  <!-- Background Gear representing Modding/Settings -->
  <!-- Outer teeth -->
  <circle cx="128" cy="128" r="76" fill="none" stroke="#29292e" stroke-width="28" stroke-dasharray="35 24" />
  <!-- Inner blue accent ring matching your 'Load Preset' button -->
  <circle cx="128" cy="128" r="62" fill="none" stroke="#2c8ed6" stroke-width="6" />
  
  <!-- Stylized Warhammer -->
  <g transform="rotate(45 128 128)">
    
    <!-- Handle -->
    <rect x="116" y="110" width="24" height="90" fill="#a1a1aa" rx="4"/>
    
    <!-- Pommel -->
    <rect x="110" y="192" width="36" height="12" fill="#e1e1e6" rx="4"/>
    
    <!-- Grip wraps -->
    <line x1="116" y1="130" x2="140" y2="130" stroke="#121214" stroke-width="4"/>
    <line x1="116" y1="150" x2="140" y2="150" stroke="#121214" stroke-width="4"/>
    <line x1="116" y1="170" x2="140" y2="170" stroke="#121214" stroke-width="4"/>
    
    <!-- Hammer Head Base -->
    <rect x="88" y="50" width="80" height="54" fill="#e1e1e6" rx="8"/>
    
    <!-- Striking faces (glowing green matching your 'Apply' button) -->
    <rect x="76" y="62" width="104" height="30" fill="#4cd62c" rx="6" filter="url(#glow)"/>
    
    <!-- Center Head Detail -->
    <rect x="108" y="50" width="40" height="54" fill="#323238" />
    <circle cx="128" cy="77" r="8" fill="#121214" />
  </g>
</svg>
