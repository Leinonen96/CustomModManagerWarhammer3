<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lightweight WH3 Mod Manager</title>
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <!-- Local Static Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='gemini-svg.svg') }}">
</head>
<body>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal">
            <h2>⚙️ Mod Manager Settings</h2>
            <p style="font-size: 0.9em; color: #a1a1aa;">Set the absolute paths for your system. These are saved locally.</p>
            
            <label>
                Workshop Directory:
                <span class="tooltip">ⓘ
                    <span class="tooltip-text">Where Steam physically downloads the raw .pack files and images for your subscribed mods.</span>
                </span>
            </label>
            <input type="text" id="config-workshop" placeholder="e.g., C:/Program Files (x86)/Steam/steamapps/workshop/content/1142710">
            
            <label>
                Game Data Directory:
                <span class="tooltip">ⓘ
                    <span class="tooltip-text">The game's actual installation folder where the mod symlinks get placed.</span>
                </span>
            </label>
            <input type="text" id="config-data" placeholder="e.g., C:/Program Files (x86)/Steam/steamapps/common/Total War WARHAMMER III/data">
            
            <label>
                User Script File (.txt):
                <span class="tooltip">ⓘ
                    <span class="tooltip-text">The file (usually in AppData or a Proton prefix) that dictates the exact load order to the game engine.</span>
                </span>
            </label>
            <input type="text" id="config-script" placeholder="e.g., C:/Users/Public/AppData/Roaming/The Creative Assembly/Warhammer3/scripts/user.script.txt">
            
            <div class="modal-buttons">
                <button class="btn-red" id="close-modal-btn" onclick="closeSettings()">Cancel</button>
                <button onclick="saveSettings()">Save & Reload</button>
            </div>
        </div>
    </div>

    <!-- Main Controls Bar -->
    <div class="controls">
        <select id="preset-select">
            <option value="">-- Select Preset --</option>
        </select>
        <button class="btn-blue" onclick="loadPreset()">Load Preset</button>
        <button class="btn-red" onclick="deletePreset()">Delete Preset</button>
        
        <div style="width: 20px;"></div> 
        <input type="text" id="preset-name" placeholder="Name new preset...">
        <button class="btn-blue" onclick="savePreset()">Save / Update Preset</button>
        
        <div style="flex-grow: 1;"></div> 
        <button class="btn-blue" onclick="openSettings()">⚙️ Settings</button>
        <button onclick="applyLoadOrder()">APPLY TO GAME</button>
    </div>

    <!-- Mod Lists Container -->
    <div class="container">
        <div class="panel">
            <h3 style="margin-top: 0;">Available Mods (Inactive)</h3>
            <input type="text" id="search-inactive" class="search-bar" placeholder="Search available mods..." onkeyup="filterInactive()">
            <div id="inactive-mods" class="mod-list"></div>
        </div>
        
        <div class="panel">
            <h3 style="margin-top: 0;">Active Load Order (Top loads first)</h3>
            <input type="text" id="search-active" class="search-bar" placeholder="Search active mods..." onkeyup="filterActive()">
            <div id="active-mods" class="mod-list"></div>
        </div>
    </div>

    <!-- External JavaScript File -->
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
