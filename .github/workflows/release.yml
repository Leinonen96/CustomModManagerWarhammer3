name: Release & Binary Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Bump Type (patch, minor, major, or custom)'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom Version (only if Bump Type is "custom", e.g. 2.3.0)'
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Prepare & Verify Release ──
  prepare-release:
    name: Prepare & Verify Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.set_tag.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install NPM dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Frontend Production Build (Vite)
        run: npm run build

      - name: Rust Clippy Lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust Backend Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Rust Code Formatting Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      # Handle automated version bumping when triggered from GitHub Actions UI
      - name: Bump Version and Push Tag (Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: dispatch_bump
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          CUSTOM_VER="${{ github.event.inputs.custom_version }}"

          if [ "$BUMP_TYPE" = "custom" ]; then
            if [ -z "$CUSTOM_VER" ]; then
              echo "❌ Error: Custom version is required when bump_type is 'custom'"
              exit 1
            fi
            TARGET_ARG="$CUSTOM_VER"
          else
            TARGET_ARG="$BUMP_TYPE"
          fi

          echo "📦 Running version bump with: $TARGET_ARG"
          node scripts/bump_version.js "$TARGET_ARG"

          NEW_VER=$(node -p "require('./package.json').version")
          TAG_NAME="v${NEW_VER}"
          echo "NEW_TAG=$TAG_NAME" >> $GITHUB_ENV

          # Configure bot git user
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): bump version to ${TAG_NAME} [skip ci]"
          git tag "$TAG_NAME"
          git push origin main "$TAG_NAME"

      # Determine final release tag output
      - name: Resolve Release Tag
        id: set_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FINAL_TAG="${{ env.NEW_TAG }}"
          else
            FINAL_TAG="${{ github.ref_name }}"
          fi
          echo "Release tag: $FINAL_TAG"
          echo "release_tag=$FINAL_TAG" >> $GITHUB_OUTPUT

  # ── Build & Release Binaries on Linux and Windows ──
  build-release:
    name: Build & Release (${{ matrix.platform }})
    needs: [prepare-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 for release builds ensures broad glibc compatibility
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            javascriptcoregtk-4.1 \
            libfuse2 \
            rpm

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Tauri Desktop Application & Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare-release.outputs.release_tag }}
          releaseName: 'WH3 Mod Manager ${{ needs.prepare-release.outputs.release_tag }}'
          releaseBody: ''
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Generate Linux SHA256 checksums
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.AppImage.tar.gz" \) \
            -exec sha256sum {} \; | tee checksums-linux.txt
          echo "Generated checksums:"
          cat checksums-linux.txt

      - name: Upload Linux checksums to release
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          files: src-tauri/target/release/bundle/checksums-linux.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Windows SHA256 checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundlePath = "src-tauri/target/release/bundle"
          $files = Get-ChildItem -Path $bundlePath -Recurse -Include *.exe,*.msi,*.nsis.zip
          $checksums = @()
          foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            $relativePath = $file.FullName.Replace("$bundlePath\", "").Replace("\", "/")
            $checksums += "$hash  ./$relativePath"
          }
          $checksums | Set-Content -Path "$bundlePath/checksums-windows.txt"
          Write-Host "Generated checksums:"
          Get-Content "$bundlePath/checksums-windows.txt"

      - name: Upload Windows checksums to release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          files: src-tauri/target/release/bundle/checksums-windows.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
