name: Release & Binary Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.3.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── CI Gate: must pass before any release binaries are built ──
  ci-gate:
    name: Pre-Release Verification
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install NPM dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Frontend Production Build (Vite)
        run: npm run build

      - name: Rust Clippy Lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust Backend Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Rust Code Formatting Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  # ── Build & Release: runs after CI gate passes ──
  build-release:
    name: Build & Release (${{ matrix.platform }})
    needs: [ci-gate]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 for release builds ensures broad glibc compatibility
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            javascriptcoregtk-4.1 \
            libfuse2 \
            rpm

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Tauri Desktop Application & Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'WH3 Mod Manager ${{ github.ref_name }}'
          releaseBody: ''
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Generate SHA256 checksums
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.AppImage.tar.gz" \) \
            -exec sha256sum {} \; | tee checksums-linux.txt
          echo "Generated checksums:"
          cat checksums-linux.txt

      - name: Upload checksums to release
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/bundle/checksums-linux.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundlePath = "src-tauri/target/release/bundle"
          $files = Get-ChildItem -Path $bundlePath -Recurse -Include *.exe,*.msi,*.nsis.zip
          $checksums = @()
          foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            $relativePath = $file.FullName.Replace("$bundlePath\", "").Replace("\", "/")
            $checksums += "$hash  ./$relativePath"
          }
          $checksums | Set-Content -Path "$bundlePath/checksums-windows.txt"
          Write-Host "Generated checksums:"
          Get-Content "$bundlePath/checksums-windows.txt"

      - name: Upload Windows checksums to release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/bundle/checksums-windows.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
