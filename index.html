<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total War: WARHAMMER III Mod Manager</title>

    <!-- App Icon -->
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="icon" type="image/svg+xml" href="/gemini-svg.svg">
    <meta name="theme-color" content="#08090D">
</head>
<body>

    <!-- Main Scalable Workspace Area (Titlebar stays fixed above) -->
    <div id="app-workspace" class="app-workspace">
        <!-- Main Header Controls Bar -->
        <header class="controls">
            <div class="preset-group">
                <div id="preset-select-container"></div>
                <button id="btn-load-preset" class="btn btn-secondary" title="Load active preset">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> Load
                </button>
                <button id="btn-delete-preset" class="btn btn-danger" title="Delete selected preset">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>
            
            <div class="preset-save-group">
                <input type="text" id="preset-name" placeholder="Preset name..." class="text-input">
                <button id="btn-save-preset" class="btn btn-secondary" title="Save current load order as preset">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> Save
                </button>
            </div>
            
            <div class="spacer"></div> 
            
            <div class="action-group">
                <button id="btn-auto-sort" class="btn btn-secondary" title="Auto-sort active load order by dependencies">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg> Auto-Sort
                </button>
                <button id="btn-toggle-inspector" class="btn btn-secondary" title="Toggle Conflict Inspector Drawer">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg> Inspector
                </button>
                <button id="btn-open-settings" class="btn btn-secondary" title="Open Settings">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> Settings
                </button>
                <button id="btn-apply-order" class="btn btn-primary" title="Apply active load order to Warhammer 3">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg> APPLY TO GAME
                </button>
            </div>
        </header>

        <!-- Mod Lists Container -->
        <main class="container">
            <!-- Inactive Mods Panel -->
            <section class="panel">
                <div class="panel-header">
                    <div class="panel-title-row">
                        <h3>Available Mods</h3>
                        <span id="count-inactive" class="count-badge">0</span>
                    </div>
                    <input type="text" id="search-inactive" class="search-bar" placeholder="Search available mods (name, title, ID)...">
                </div>
                <div id="inactive-mods" class="mod-list" aria-label="Available Mods List"></div>
            </section>
            
            <!-- Active Mods Panel -->
            <section class="panel panel-active">
                <div class="panel-header">
                    <div class="panel-title-row">
                        <h3>Active Load Order <span class="sub-text">(Top loads first)</span></h3>
                        <span id="count-active" class="count-badge count-badge-active">0</span>
                    </div>
                    <input type="text" id="search-active" class="search-bar" placeholder="Search active mods...">
                </div>
                <div id="active-mods" class="mod-list" aria-label="Active Load Order List"></div>
            </section>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal"></div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Application Script Entry Point -->
    <script type="module" src="/frontend/src/main.ts"></script>
</body>
</html>
